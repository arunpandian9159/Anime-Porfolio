    <!-- Critical CSS for Speed Index optimization -->
    <style>
      /* Critical styles for above-the-fold content */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: 'Outfit', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      
      /* Hero section critical styles */
      #root {
        min-height: 100vh;
      }
      
      /* Navigation critical styles */
      nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        background: rgba(12, 16, 36, 0.95);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(177, 207, 255, 0.09);
      }
      
      /* Logo and basic layout */
      .font-display {
        font-family: 'Orbitron', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      
      .text-punch-red {
        color: #e63946;
      }
      
      .text-honeydew {
        color: #f1faee;
      }
      
      .text-frosted-blue {
        color: #b1cff5;
      }
      
      .bg-oxford-navy {
        background-color: #0c1024;
      }
      
      .bg-oxford-navy-dark {
        background-color: #0a0e20;
      }
      
      /* Grid and flexbox for layout */
      .grid {
        display: grid;
      }
      
      .flex {
        display: flex;
      }
      
      .items-center {
        align-items: center;
      }
      
      .justify-center {
        justify-content: center;
      }
      
      .justify-between {
        justify-content: space-between;
      }
      
      .text-center {
        text-align: center;
      }
      
      /* Basic spacing */
      .p-4 {
        padding: 1rem;
      }
      
      .p-5 {
        padding: 1.25rem;
      }
      
      .px-4 {
        padding-left: 1rem;
        padding-right: 1rem;
      }
      
      .px-5 {
        padding-left: 1.25rem;
        padding-right: 1.25rem;
      }
      
      .py-4 {
        padding-top: 1rem;
        padding-bottom: 1rem;
      }
      
      .py-5 {
        padding-top: 1.25rem;
        padding-bottom: 1.25rem;
      }
      
      .mb-4 {
        margin-bottom: 1rem;
      }
      
      .mb-5 {
        margin-bottom: 1.25rem;
      }
      
      /* Typography */
      .text-3xl {
        font-size: 1.875rem;
        line-height: 2.25rem;
      }
      
      .text-lg {
        font-size: 1.125rem;
        line-height: 1.75rem;
      }
      
      .font-black {
        font-weight: 900;
      }
      
      .font-semibold {
        font-weight: 600;
      }
      
      /* Transitions */
      .transition-all {
        transition-property: all;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        transition-duration: 150ms;
      }
      
      /* Opacity for loading states */
      .opacity-0 {
        opacity: 0;
      }
      
      .opacity-100 {
        opacity: 1;
      }
    </style>
